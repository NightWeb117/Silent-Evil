name: Crossover build

# Builds residentevil.exe + CrossoverLauncher.exe on every push and uploads
# them as a downloadable artifact. No game assets are involved.
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild Game.sln
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /t:Build
          /m
          /v:minimal

      - name: Stage
        run: |
          $out = "stage/SilentHillxRE"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "bin/Release/residentevil.exe" $out
          Copy-Item "bin/Release/CrossoverLauncher.exe" $out
          Copy-Item "config.ini.template" "$out/config.ini"
          Copy-Item "crossover/README.md" "$out/CROSSOVER.md"
          Copy-Item "LICENSE" $out

      - uses: actions/upload-artifact@v4
        with:
          name: SilentHillxRE-windows-x86
          path: stage/SilentHillxRE
